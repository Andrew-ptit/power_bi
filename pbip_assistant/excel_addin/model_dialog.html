<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reqwise · Mô hình dữ liệu</title>
  <link rel="stylesheet" href="/assets/taskpane.css">
</head>
<body class="model-dialog-body">
  <header class="model-dialog-header">
    <h1 id="model-dialog-title">Mô hình dữ liệu · 1 : 3</h1>
    <p id="model-dialog-status" class="hint" role="status" aria-live="polite"></p>
    <button id="model-dialog-collapse" class="button button-ghost" type="button">Thu gọn</button>
  </header>
  <main class="model-dialog-main">
    <aside class="model-dialog-list" aria-label="Bảng và quan hệ">
      <h2>Bảng</h2>
      <div id="model-dialog-tables"></div>
      <h2>Quan hệ</h2>
      <div id="model-dialog-relationships"></div>
    </aside>
    <section class="model-dialog-diagram" aria-label="Sơ đồ đầy đủ">
      <div id="model-dialog-diagram-host"></div>
    </section>
  </main>
  <script src="/assets/model_dialog.js" defer></script>
</body>
</html>
